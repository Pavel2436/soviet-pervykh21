    function checkAchievements(userId) {
        const achievements = getAchievements();
        const userAchievements = achievements.filter(a=>a.userId===userId).map(a=>a.achievementId);
        const user = getUsers().find(u=>u.id===userId);
        if(!user) return;
        const grades = getGrades();
        const tc = getTaskCompletions();
        const vh = getVolunteerHours();
        const msgs = [...getGeneralChat(), ...getMessages(), ...getPrivateMessages()];
        let newAch = [];
        ACHIEVEMENTS_DEF.forEach(def=>{
            if(!userAchievements.includes(def.id) && def.condition(user,grades,tc,vh,msgs)) {
                newAch.push({id:utils.genId(), userId, achievementId:def.id, date:new Date().toISOString()});
            }
        });
        if(newAch.length>0) {
            achievements.push(...newAch);
            saveAchievements(achievements);
            newAch.forEach(a=>{
                const def = ACHIEVEMENTS_DEF.find(d=>d.id===a.achievementId);
                if(def) UI.toast(`🏆 Достижение: ${def.icon} ${def.name}!`,'success');
            });
        }
    }

    async function uploadFile(file, folder) {
        return new Promise((resolve,reject)=>{
            const fileRef=storageRef(storage,`${folder}/${utils.genId()}_${file.name}`);
            const task=uploadBytesResumable(fileRef,file);
            const pb=document.querySelector('.progress-bar'), pf=document.querySelector('.progress-bar .progress');
            if(pb) pb.style.display='block';
            task.on('state_changed', snap=>{ if(pf) pf.style.width=(snap.bytesTransferred/snap.totalBytes)*100+'%'; }, err=>{ if(pb) pb.style.display='none'; reject(err); }, async()=>{ const url=await getDownloadURL(task.snapshot.ref); if(pb) pb.style.display='none'; resolve({url,name:file.name,type:file.type,path:task.snapshot.ref.fullPath}); });
        });
    }
    async function uploadFromUrl(url, folder, filename) {
        try { const resp=await fetch(url,{mode:'cors'}); if(!resp.ok) throw new Error('Не удалось загрузить файл'); const blob=await resp.blob(); const file=new File([blob], filename||'file.jpg',{type:blob.type}); return await uploadFile(file, folder); } catch(e) { throw new Error('Ошибка загрузки по URL: '+e.message); }
    }

    async function initData() {
        for(const [key,path] of Object.entries(DB_PATHS)) {
            const data=await loadData(path);
            if(data) cache[key]=data;
            else {
                if(key==='users') await saveData(path, createUsers());
                else if(key==='positions') await saveData(path, POSITIONS);
                else if(key==='districts') await saveData(path, DISTRICTS);
                else if(key==='settings') await saveData(path, { theme:'light', primaryColor:'red', headerImage:'' });
                else if(key==='vkSettings') await saveData(path, { token:'', groupIds:'-216368754,-mypervie21,-sovet_pervykh' });
                else if(key==='customAchievements') await saveData(path, []);
                else await saveData(path, []);
            }
        }
        if(cache.positions?.length) POSITIONS=cache.positions;
        if(cache.districts?.length) DISTRICTS=cache.districts;
    }

    // Исправленная функция сводки: добавлены карточки статистики, исключены пользователи без оценок
    function renderSummaryTab() {
        const users = getUsers().filter(u => u.role === 'user');
        const grades = getGrades();
        const userStats = users.map(u => {
            const gs = grades.filter(g => g.userId === u.id);
            const avg = gs.length ? gs.reduce((s, g) => s + g.grade, 0) / gs.length : 0;
            return { ...u, avg, count: gs.length };
        }).filter(r => r.count > 0).sort((a, b) => b.avg - a.avg);

        const totalAvg = userStats.length ? (userStats.reduce((s, u) => s + u.avg, 0) / userStats.length).toFixed(2) : '—';
        const maxAvg = userStats.length ? userStats[0].avg.toFixed(2) : '—';
        const minAvg = userStats.length ? userStats[userStats.length - 1].avg.toFixed(2) : '—';

        return `
        <div class="card">
            <h3>📈 Сводка по участникам</h3>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;">
                <div class="stat-card"><div class="stat-number">${totalAvg}</div><div class="stat-label">Общий средний балл</div></div>
                <div class="stat-card"><div class="stat-number">${userStats.length}</div><div class="stat-label">Участников с оценками</div></div>
                <div class="stat-card"><div class="stat-number">${maxAvg}</div><div class="stat-label">Максимальный балл</div></div>
                <div class="stat-card"><div class="stat-number">${minAvg}</div><div class="stat-label">Минимальный балл</div></div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Место</th><th>ФИО</th><th>Округ</th><th>Средний балл</th><th>Оценок</th></tr></thead>
                    <tbody>${userStats.map((u, i) => {
                        let bgColor;
                        if (u.avg >= 3.5) bgColor = '#DCFCE7';
                        else if (u.avg >= 2.5) bgColor = '#E0F2FE';
                        else bgColor = '#FEF9C3';
                        return `<tr>
                            <td>${i + 1}</td>
                            <td>${utils.esc(u.fullName || u.name)}</td>
                            <td>${utils.esc(u.district || '—')}</td>
                            <td><span style="font-weight:700;padding:4px 10px;border-radius:50px;background:${bgColor};color:#1A1A2E;">${u.avg.toFixed(2)}</span></td>
                            <td>${u.count}</td>
                        </tr>`;
                    }).join('') || '<tr><td colspan="5">Нет данных</td></tr>'}</tbody>
                </table>
            </div>
        </div>`;
    }

    // ==================== БИНДИНГИ И ГЛОБАЛЬНЫЕ ФУНКЦИИ ====================
    function bindTabEvents(idx) {
        const tn = document.querySelectorAll('.tab-btn')[idx]?.textContent || '';
        if (tn.includes('Чаты')) bindChats();
        else if (tn.includes('ЛС')) bindPM();
        else if (tn.includes('Новости')) bindNews();
        else if (tn.includes('Связь')) bindFeedback();
        else if (tn.includes('Оценки')) bindGrades();
        else if (tn.includes('Участники')) bindUsers();
        else if (tn.includes('Округа')) bindDistricts();
        else if (tn.includes('Лидерство')) bindLeader();
        else if (tn.includes('Медиа')) bindMedia();
        else if (tn.includes('Профиль')) bindProfile();
        else if (tn.includes('События')) bindEvents();
        else if (tn.includes('Опросы')) bindPolls();
        else if (tn.includes('Часы')) bindVolunteer();
        else if (tn.includes('Заметки')) bindNotes();
    }

    function bindChats() {
        const session = getSession(); const activeId = session.activeChatGroup || 'general';
        function load() { const box = document.getElementById('chatMessagesBox'); if (!box) return; const msgs = activeId === 'general' ? getGeneralChat() : getMessages().filter(m => m.groupId === activeId); box.innerHTML = msgs.sort((a, b) => new Date(a.date) - new Date(b.date)).map(m => { const u = getUsers().find(u => u.id === m.from); return `<div><strong>${utils.esc(u?.fullName || u?.name)}</strong>: ${utils.esc(m.text)}</div>`; }).join(''); box.scrollTop = box.scrollHeight; }
        load();
        document.getElementById('sendChatMessageBtn')?.addEventListener('click', async () => { const input = document.getElementById('chatMessageInput'); if (!input.value.trim()) return; const text = input.value.trim(); if (activeId === 'general') { const c = getGeneralChat(); c.push({ id: utils.genId(), from: session.userId, text, date: new Date().toISOString() }); await saveGeneralChat(c); } else { const m = getMessages(); m.push({ id: utils.genId(), from: session.userId, groupId: activeId, text, date: new Date().toISOString() }); await saveMessages(m); } input.value = ''; load(); checkAchievements(session.userId); });
        document.getElementById('createGroupBtn')?.addEventListener('click', async () => { const name = document.getElementById('newGroupName')?.value.trim(); if (!name) return; const g = getChatGroups(); const ng = { id: utils.genId(), name, createdBy: session.userId, createdAt: new Date().toISOString() }; g.push(ng); await saveChatGroups(g); session.activeChatGroup = ng.id; saveSession(session); renderDashboard(); });
        setInterval(load, 5000);
    }

    function bindPM() {
        const session = getSession(); const selId = session.activePrivateChat ? parseInt(session.activePrivateChat) : null;
        const box = document.getElementById('privateMessagesBox');
        if (selId && box) { const msgs = getPrivateMessages().filter(m => (m.from === session.userId && m.to === selId) || (m.from === selId && m.to === session.userId)).sort((a, b) => new Date(a.date) - new Date(b.date)); box.innerHTML = msgs.map(m => { const u = getUsers().find(u => u.id === m.from); return `<div><strong>${utils.esc(u?.fullName || u?.name)}</strong>: ${utils.esc(m.text)}</div>`; }).join(''); box.scrollTop = box.scrollHeight; }
        document.getElementById('sendPrivateMessageBtn')?.addEventListener('click', async () => { if (!selId) return; const input = document.getElementById('privateMessageInput'); if (!input.value.trim()) return; const pm = getPrivateMessages(); pm.push({ id: utils.genId(), from: session.userId, to: selId, text: input.value.trim(), date: new Date().toISOString() }); await savePrivateMessages(pm); input.value = ''; bindPM(); checkAchievements(session.userId); });
    }

    function bindUsers() {
        const updateForm = () => { const user = getUsers().find(u => u.id === window._selectedUserId); if (!user) return; document.getElementById('editLogin').value = user.login; document.getElementById('editPassword').value = user.password; document.getElementById('editFullName').value = user.fullName || ''; document.getElementById('editPosition').value = user.position || 'Участник'; document.getElementById('editDistrict').value = user.district || ''; document.getElementById('editActivated').checked = user.activated; document.getElementById('editSkills').value = (user.skills || []).join(', '); document.querySelectorAll('#leaderCheckboxes input').forEach(cb => { cb.checked = (user.leaderDirections || []).includes(cb.value); }); };
        updateForm();
        document.getElementById('userEditForm').onsubmit = async (e) => { e.preventDefault(); const users = getUsers(); const user = users.find(u => u.id === window._selectedUserId); if (!user) return; user.login = document.getElementById('editLogin').value; user.password = document.getElementById('editPassword').value; user.fullName = document.getElementById('editFullName').value; user.position = document.getElementById('editPosition').value; user.district = document.getElementById('editDistrict').value; user.activated = document.getElementById('editActivated').checked; user.leaderDirections = Array.from(document.querySelectorAll('#leaderCheckboxes input:checked')).map(cb => cb.value); user.skills = document.getElementById('editSkills').value.split(',').map(s => s.trim()).filter(Boolean); await saveUsers(users); UI.toast('✅ Сохранено', 'success'); refreshCurrentTab(); };

    async function syncVkNews() {
        const vk = getVkSettings();
        if (!vk.token || !vk.groupIds) return UI.toast('Укажите токен VK и ID групп в настройках', 'error');
        const groupIds = vk.groupIds.split(',').map(s => s.trim()).filter(Boolean);
        let added = 0;
        for (const gid of groupIds) {
            try {
                const resp = await fetch(`https://api.vk.com/method/wall.get?owner_id=${gid}&count=10&access_token=${vk.token}&v=5.131`);
                const data = await resp.json();
                if (data.error) throw new Error(data.error.error_msg);
                const posts = data.response.items;
                const news = getNews();
                for (const p of posts) {
                    if (news.some(n => n.vkPostId === `${gid}_${p.id}`)) continue;
                    const text = p.text || '';
                    news.push({
                        id: utils.genId(),
                        title: text.split('\n')[0].slice(0, 100) || 'Пост из VK',
                        content: text,
                        files: p.attachments?.filter(a => a.type === 'photo').map(a => ({ url: a.photo.sizes.slice(-1)[0].url, type: 'image/jpeg' })) || [],
                        date: new Date(p.date * 1000).toISOString(),
                        vkPostId: `${gid}_${p.id}`
                    });
                    added++;
                }
                await saveNews(news);
            } catch (e) { UI.toast(`Ошибка VK (${gid}): ${e.message}`, 'error'); }
        }
        if (added) UI.toast(`✅ Загружено ${added} новостей из VK`, 'success');
    }

    window._toggleFavorite = async (targetUserId) => { const userId = getSession().userId; const favs = getFavorites(); const idx = favs.findIndex(f => f.userId === userId && f.targetUserId === targetUserId); if (idx >= 0) favs.splice(idx, 1); else favs.push({ id: utils.genId(), userId, targetUserId, date: new Date().toISOString() }); await saveFavorites(favs); UI.toast(idx >= 0 ? 'Убрано из избранного' : '⭐ Добавлено в избранное', 'success'); refreshCurrentTab(); };
    window._deleteNote = async (id) => { if (confirm('Удалить заметку?')) { await saveNotes(getNotes().filter(n => n.id !== id)); refreshCurrentTab(); } };
    window._exportUsersToExcel = () => { const users = getUsers(); const rows = [['ID', 'Логин', 'ФИО', 'Роль', 'Должность', 'Округ', 'Активирован']]; users.forEach(u => { rows.push([u.id, u.login, u.fullName || u.name, u.role, u.position || '', u.district || '', u.activated ? 'Да' : 'Нет']); }); utils.exportToCSV('Пользователи', rows); UI.toast('📥 Экспорт выполнен', 'success'); };
    window._exportGradesToExcel = (uid) => { const grades = getGrades().filter(g => g.userId === uid); const user = getUsers().find(u => u.id === uid); const rows = [['Оценки пользователя: ' + (user?.fullName || user?.name)], ['№', 'Категория', 'Оценка', 'Описание', 'Дата']]; grades.forEach((g, i) => { rows.push([i + 1, g.category || '', g.grade, g.description || '', utils.fmtDate(g.date)]); }); utils.exportToCSV('Оценки_' + (user?.fullName || uid), rows); UI.toast('📥 Экспорт оценок', 'success'); };
    window._deleteInactiveWithoutName = async () => { const users = getUsers(); const toDelete = users.filter(u => u.role === 'user' && !u.activated && (!u.fullName || u.fullName.trim() === '')); if (toDelete.length === 0) { UI.toast('❌ Нет таких пользователей', 'warning'); return; } if (!confirm(`Удалить ${toDelete.length} неактивных без ФИО?`)) return; await saveUsers(users.filter(u => !toDelete.some(d => d.id === u.id))); UI.toast(`🗑 Удалено ${toDelete.length} пользователей`, 'success'); window._selectedUserId = getUsers()[0]?.id || null; refreshCurrentTab(); };
    window._viewProfile = (uid) => { const u = getUsers().find(u => u.id === uid); const avg = getAvg(uid); const xp = getXP(uid); const lvl = getLevel(xp); if (u) UI.modal('👤 ' + utils.esc(u.fullName || u.name), `<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">${UI.userAvatar(u)}<div><strong>${utils.esc(u.fullName || u.name)}</strong><br>${utils.esc(u.position || 'Участник')} · Уровень ${lvl} (${xp} XP)</div></div><p><strong>Округ:</strong> ${utils.esc(u.district || '—')}</p><p><strong>Email:</strong> ${utils.esc(u.email || '—')}</p>${u.bio ? `<p><strong>О себе:</strong> ${utils.esc(u.bio)}</p>` : ''}${avg ? `<p><strong>Средний балл:</strong> ${avg}</p>` : ''}`, [{ text: 'Закрыть', primary: true, id: 'close' }]); };
    window._viewProfilePublic = (uid) => { const u = getUsers().find(u => u.id === uid); if (!u) return; const avg = getAvg(uid); const xp = getXP(uid); const lvl = getLevel(xp); UI.modal('👤 ' + utils.esc(u.fullName || u.name), `<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">${UI.userAvatar(u)}<div><strong>${utils.esc(u.fullName || u.name)}</strong><br>${utils.esc(u.position || 'Участник')} · Уровень ${lvl}</div></div><p><strong>Округ:</strong> ${utils.esc(u.district || '—')}</p><p><strong>Email:</strong> ${utils.esc(u.email || '—')}</p>${avg ? `<p><strong>Средний балл:</strong> ${avg}</p>` : ''}`, [{ text: 'Закрыть', primary: true, id: 'close' }]); };
    window._filterTeam = (q) => { const users = getUsers(); const f = q ? users.filter(u => (u.fullName || u.name).toLowerCase().includes(q.toLowerCase()) || (u.position || '').toLowerCase().includes(q.toLowerCase())) : users; const favs = getFavorites().filter(f => f.userId === getSession()?.userId).map(f => f.targetUserId); document.getElementById('teamList').innerHTML = f.map(u => { const isFav = favs.includes(u.id); return `<div class="card" style="padding:10px;display:flex;align-items:center;gap:10px;transition:0.2s;" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''">${UI.userAvatar(u)}<div style="flex:1;cursor:pointer;" onclick="window._viewProfile(${u.id})"><strong>${utils.esc(u.fullName || u.name)}</strong>${u.role === 'admin' ? '<span class="admin-icon">Админ</span>' : ''}${isLeader(u) ? '<span class="leader-icon">Лидер</span>' : ''}<br><small>${utils.esc(u.position || 'Участник')} · ${utils.esc(u.district || '—')}</small></div><button class="btn btn-sm ${isFav ? 'btn-primary' : ''}" onclick="event.stopPropagation();window._toggleFavorite(${u.id})">${isFav ? '⭐' : '☆'}</button></div>`; }).join(''); };
    window._openDisputeModal = (gradeId) => { const grade = getGrades().find(g => g.id === gradeId); if (!grade) return; UI.modal('⚡ Оспорить оценку', `<p>Оценка: ${grade.grade}⭐</p><p>${utils.esc(grade.description)}</p><textarea id="disputeReason" placeholder="Причина" style="width:100%;height:80px;"></textarea>`, [{ text: 'Отмена', id: 'cancel' }, { text: '⚡ Оспорить', primary: true, id: 'submit', callback: async () => { const reason = document.getElementById('disputeReason').value.trim(); if (!reason) { UI.toast('❌ Укажите причину', 'error'); return; } const disputes = getDisputes(); disputes.push({ id: utils.genId(), gradeId, userId: getSession().userId, reason, status: 'pending', date: new Date().toISOString() }); await saveDisputes(disputes); UI.toast('✅ Оценка оспорена', 'success'); refreshCurrentTab(); }, closeModal: false }]); };
    window._setDisputeFilter = (f) => { window._disputeFilter = f; refreshCurrentTab(); };
    window._resolveDisputeApprove = async (id) => { const d = getDisputes().find(d => d.id === id); if (d) { await saveGrades(getGrades().filter(g => g.id !== d.gradeId)); d.status = 'approved'; await saveDisputes(getDisputes()); UI.toast('Спор одобрен, оценка удалена', 'success'); refreshCurrentTab(); } };
    window._resolveDisputeReject = async (id) => { const d = getDisputes().find(d => d.id === id); if (d) { d.status = 'rejected'; await saveDisputes(getDisputes()); UI.toast('Спор отклонён', 'success'); refreshCurrentTab(); } };
    window._editGradeFromDispute = (gradeId) => { const grade = getGrades().find(g => g.id === gradeId); if (!grade) return; UI.modal('Изменить оценку', `<select id="egc">${GRADE_CATEGORIES.map(c => `<option ${c === grade.category ? 'selected' : ''}>${c}</option>`).join('')}</select><select id="egv">${[4,3,2,1,0].map(v => `<option ${v === grade.grade ? 'selected' : ''}>${v}⭐</option>`).join('')}</select><input id="egd" value="${utils.esc(grade.description)}">`, [{ text: 'Сохранить', primary: true, id: 'save', callback: async () => { grade.category = document.getElementById('egc').value; grade.grade = parseInt(document.getElementById('egv').value); grade.description = document.getElementById('egd').value; await saveGrades(getGrades()); UI.toast('Оценка изменена', 'success'); refreshCurrentTab(); } }]); };
    window._editGrade = (gradeId) => { const grade = getGrades().find(g => g.id === gradeId); if (!grade) return; UI.modal('✏️ Редактировать оценку', `<select id="egc">${GRADE_CATEGORIES.map(c => `<option ${c === grade.category ? 'selected' : ''}>${c}</option>`).join('')}</select><select id="egv">${[4,3,2,1,0].map(v => `<option ${v === grade.grade ? 'selected' : ''}>${v}⭐</option>`).join('')}</select><input id="egd" value="${utils.esc(grade.description)}">`, [{ text: 'Сохранить', primary: true, id: 'save', callback: async () => { grade.category = document.getElementById('egc').value; grade.grade = parseInt(document.getElementById('egv').value); grade.description = document.getElementById('egd').value; await saveGrades(getGrades()); UI.toast('✅ Оценка обновлена', 'success'); refreshCurrentTab(); } }]); };
    window._uploadAvatar = async (input) => { const file = input.files[0]; if (!file || !file.type.startsWith('image/')) { UI.toast('❌ Только изображения', 'error'); return; } try { const res = await uploadFile(file, 'avatars'); const users = getUsers(); const u = users.find(u => u.id === getSession().userId); if (u.photoPath) try { await deleteObject(storageRef(storage, u.photoPath)); } catch { } u.photoURL = res.url; u.photoPath = res.path; await saveUsers(users); document.getElementById('profileAvatarImg').src = res.url; UI.toast('✅ Аватар обновлён', 'success'); } catch { UI.toast('❌ Ошибка', 'error'); } };
    window._saveProfileInfo = async () => { const users = getUsers(); const u = users.find(u => u.id === getSession().userId); u.fullName = document.getElementById('profFullName')?.value || ''; u.district = document.getElementById('profDistrict')?.value || ''; u.birthday = document.getElementById('profBirthday')?.value || ''; u.email = document.getElementById('profEmail')?.value || ''; u.phone = document.getElementById('profPhone')?.value || ''; u.skills = document.getElementById('profSkills')?.value.split(',').map(s => s.trim()).filter(Boolean) || []; u.hobbies = document.getElementById('profHobbies')?.value || ''; u.education = document.getElementById('profEducation')?.value || ''; u.experience = document.getElementById('profExperience')?.value || ''; u.bio = document.getElementById('profBio')?.value || ''; u.socialLinks = { tg: document.getElementById('profTg')?.value || '', vk: document.getElementById('profVk')?.value || '', max: '' }; u.dobroLink = document.getElementById('profDobroLink')?.value || ''; await saveUsers(users); UI.toast('✅ Профиль обновлён', 'success'); refreshCurrentTab(); };
    window._saveSecuritySettings = async () => { const users = getUsers(); const u = users.find(u => u.id === getSession().userId); const curPass = document.getElementById('profCurrentPassword')?.value; const newLogin = document.getElementById('profLogin')?.value.trim(); const newPass = document.getElementById('profNewPassword')?.value; const confPass = document.getElementById('profConfirmPassword')?.value; if (curPass && curPass !== u.password) { UI.toast('❌ Неверный текущий пароль', 'error'); return; } if (!newLogin) { UI.toast('❌ Логин не может быть пустым', 'error'); return; } if (newLogin !== u.login && users.some(u => u.login === newLogin && u.id !== u.id)) { UI.toast('❌ Логин занят', 'error'); return; } u.login = newLogin; if (newPass) { if (newPass !== confPass) { UI.toast('❌ Пароли не совпадают', 'error'); return; } if (newPass.length < 3) { UI.toast('❌ Пароль минимум 3 символа', 'error'); return; } u.password = newPass; } await saveUsers(users); UI.toast('✅ Данные обновлены', 'success'); document.getElementById('profCurrentPassword').value = ''; document.getElementById('profNewPassword').value = ''; document.getElementById('profConfirmPassword').value = ''; };
    window._votePoll = async (pollId, option) => { const polls = getPolls(); const poll = polls.find(p => p.id === pollId); if (!poll) return; if (!poll.votes) poll.votes = {}; poll.votes[getSession().userId] = option; await savePolls(polls); refreshCurrentTab(); };
    window._deletePoll = async (id) => { if (confirm('Удалить опрос?')) { await savePolls(getPolls().filter(p => p.id !== id)); refreshCurrentTab(); } };
    window._deleteCustomAchiev = async (id) => { if (confirm('Удалить достижение?')) { await saveCustomAchievements(getCustomAchievements().filter(c => c.id !== id)); refreshCurrentTab(); } };
    window._grantAchievement = async () => { const userId = parseInt(document.getElementById('grantUserSelect').value); const achievId = document.getElementById('grantAchievSelect').value; const custom = getCustomAchievements().find(c => c.id === achievId); if (!custom || !userId) return; const achievements = getAchievements(); achievements.push({ id: utils.genId(), userId, achievementId: achievId, date: new Date().toISOString(), custom: true }); await saveAchievements(achievements); UI.toast(`✅ ${custom.icon} ${custom.name} выдано!`, 'success'); };

    document.getElementById('customAchievForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('caName').value.trim();
        const desc = document.getElementById('caDesc').value.trim();
        const icon = document.getElementById('caIcon').value.trim();
        if (!name || !desc || !icon) return UI.toast('❌ Заполните все поля', 'error');
        const custom = getCustomAchievements();
        custom.push({ id: utils.genId(), name, desc, icon, createdBy: getSession().userId, createdAt: new Date().toISOString() });
        await saveCustomAchievements(custom);
        UI.toast('✅ Достижение создано', 'success');
        refreshCurrentTab();
    });
    document.getElementById('grantBtn')?.addEventListener('click', window._grantAchievement);

    async function init() {
        await initData();
        applySettings(getSettings());
        const s = getSession();
        if (s && getUsers().find(u => u.id === s.userId)) {
            renderDashboard();
            checkAchievements(s.userId);
            if (s.role === 'admin') syncVkNews();
        } else renderLogin();
    }
    init();
</script>
</body>
</html>
